<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-with-header-footer}">
      
    <title layout:fragment="title">Space</title>
    

    <main class="relative flex al-items-stretch" layout:fragment="content">
        <th:block th:replace="~{fragments/sidebar :: sidebarFragment}"></th:block>

        <div class="vertical-line"></div>

        <div class="flex-1">
            <div class="flex">
                <div class="ml-15p mt-5vh">
                    <div class="flex-space-between al-items-f-start">
                        <div class="width-40vh flex-grow-1">
                            <div>
                                <span class="font-white" style="margin-left: 3px;">아이디</span><br/>
                                <span class="width-100p ml-5 font-white" type="text" id="user-id" th:text="${user.userId}"></span>

                                <label for="email" class="pt-20">이메일</label>
                                <input class="width-100p mb-10" type="text" id="email" th:value="${user.email}" placeholder="이메일을 입력해주세요." />
                            
                                <label for="nickname">닉네임</label>
                                <input class="width-100p" type="text" id="nickname" th:value="${user.nickname}" placeholder="닉네임을 입력해주세요." />
                            
                                <div class="button-container mt-40">
                                    <button class="btn btn-primary" type="button" id="update-user-btn">저장</button>
                                    <button class="btn btn-primary" type="button" id="go-to-main-page-btn">돌아가기</button>
                                </div>
                            </div>
                        </div>

                        <div class="flex-shrink-0 ml-20" style="margin-left: 200px;">
                            <img class="profile-img width-100 height-100 pointer"
                            src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</html>
